_config_version: 33

model:
  default: deepseek/deepseek-v4-flash
  provider: custom
  base_url: http://localhost:4000
  api_mode: chat_completions
  api_key: ${LITELLM_VIRTUAL_KEY_ADMIN}
custom_providers:
  - name: Local (localhost:4000)
    base_url: http://localhost:4000
    model: deepseek/deepseek-v4-flash
    api_mode: chat_completions
agent:
  disabled_toolsets:
    - browser
    - clarify
    - code_execution
    - computer_use
    - context_engine
    - cronjob
    - delegation
    - discord
    - discord_admin
    - feishu_doc
    - feishu_drive
    - homeassistant
    - image_gen
    - kanban
    - memory
    - project
    - search
    - session_search
    - skills
    - spotify
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
    - yuanbao
compression:
  enabled: false
display:
  tool_progress: all
memory:
  memory_enabled: false
  user_profile_enabled: false
platform_toolsets:
  cli:
    - file
    - terminal
smart_model_routing:
  enabled: false
session_reset:
  mode: none  # preserves context across Discord messages in the same channel
stt:
  enabled: false
security:
  tirith_enabled: true
  tirith_path: tirith
  tirith_timeout: 5
  tirith_fail_open: true  # allow tool execution if tirith security check times out
  redact_secrets: true
  allow_lazy_installs: false
discord:
  require_mention: false
  allowed_channels:
    - 1517682798595539045  # alerts
    - 1519774449086234674  # logs
    - 1518347733109313596  # admin
    - 1520537129653108857  # sandbox
  auto_thread: true
  history_backfill: true
  history_backfill_limit: 50
  reactions: true
approvals:
  mode: manual
  timeout: 60
  cron_mode: manual
# only restart/start — stop and status intentionally excluded
command_allowlist:
  - systemctl restart litellm-proxy
  - systemctl start litellm-proxy
  - systemctl restart watcher-env
  - systemctl start watcher-env
  - systemctl restart watcher-inventory.timer
  - systemctl start watcher-inventory.timer
  - systemctl restart metrics-llm.timer
  - systemctl start metrics-llm.timer
  - systemctl restart metrics-services.timer
  - systemctl start metrics-services.timer
  - systemctl restart metrics-toolcalls.timer
  - systemctl start metrics-toolcalls.timer
  - systemctl restart loki
  - systemctl start loki
  - systemctl restart promtail
  - systemctl start promtail
  - systemctl restart prometheus
  - systemctl start prometheus
  - systemctl restart prometheus-node-exporter
  - systemctl start prometheus-node-exporter
  - systemctl restart grafana-server
  - systemctl start grafana-server
  - systemctl restart postgresql
  - systemctl start postgresql
  - systemctl restart redis-server
  - systemctl start redis-server
onboarding:
  seen:
    profile_build_offered: true
