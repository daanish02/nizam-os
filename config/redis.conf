# Redis configuration for nizam-os.
# foundation.sh substitutes ${REDIS_PASSWORD} via envsubst before copying to /etc/redis/redis.conf.

bind 127.0.0.1
requirepass ce1cb31ef9cdb252df965f2b5e242d52eca926db72133f9d
maxmemory 256mb
maxmemory-policy allkeys-lru
dir /var/lib/redis
dbfilename dump.rdb
save ""
appendonly no
stop-writes-on-bgsave-error no
