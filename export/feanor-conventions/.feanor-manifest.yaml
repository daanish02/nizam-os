manifest_version: "2.0.0"
skill_metadata:
  name: "feanor"
  display_name: "Feanor Autonomous Software Engineering State Engine"
  description: "A spec-driven, phased state engine utilizing JIT micro-standards and evidence-based verification for clean context engineering."
  version: "1.0.0"
  author: "Danish Ahmed"
  spec_standard: "OKF-v0.2"

routing:
  root_catalog: "./index.md"
  router_definition: "./meta/command-router.md"
  context_resolver: "./meta/context-resolver.md"
  requirements_method: "./meta/requirements-checklist.md"
  maintenance_workflow: "./workflows/maintain-repo.md"

execution_gates:
  enforce_preconditions: true
  state_file: ".feanor/state/status.json"
  plan_file: "docs/plan.toml"
  profile_file: ".feanor/profile.toml"
  log_directory: ".feanor/logs/"
  scratchpad_directory: ".feanor/scratchpad/"
  requirements_input_directory: "docs/reqs/"

supported_commands:
  - command: "/brainstorm"
    phase: "requirements"
    engine: "./agents/requirements-agent.md"
  - command: "/reqs"
    phase: "requirements"
    engine: "./agents/requirements-agent.md"
  - command: "/prd"
    phase: "product"
    engine: "./agents/product-agent.md"
  - command: "/hld"
    phase: "architect"
    engine: "./agents/architect-agent.md"
  - command: "/scaffold"
    phase: "architect"
    engine: "./agents/architect-agent.md"
  - command: "/specs"
    phase: "architect"
    engine: "./agents/architect-agent.md"
  - command: "/plan"
    phase: "planner"
    engine: "./agents/planner-agent.md"
  - command: "/exec"
    phase: "execution"
    engine: "./agents/execution-agent.md"
  - command: "/audit"
    phase: "validation"
    engine: "./agents/validation-agent.md"
  - command: "/document"
    phase: "brownfield-document"
    engine: "./workflows/brownfield-standardize.md"
  - command: "/standardize"
    phase: "brownfield-standardize"
    engine: "./workflows/brownfield-standardize.md"

routing_maintainer_docs: "./docs/index.md"

validation_scripts:
  reindex: "./scripts/reindex.py"
  validate_okf: "./scripts/validate-okf.py"
  test_runner: "./scripts/run-tests.sh"
  plan_manager: "./scripts/plan.py"
  write_profile: "./scripts/write-profile.py"
