# Feanor tag -> convention file mapping. Single source of truth.
#
# Read by scripts/resolve-context.py, not by an agent directly. Do not duplicate
# this mapping into meta/context-resolver.md or agents/planner-agent.md — it lived
# in both once, drifted, and nothing caught it.
#
# Fields per entry:
#   files              paths relative to feanor/ (required)
#   aliases            other tags resolving to this entry
#   priority           1 security · 2 principles · 3 language · 4 domain · 5 devops
#                      (the ladder in meta/context-resolver.md section 3; 1 is never dropped)
#   language_qualified true  =>  go-<tag>, python-<tag>, nextjs-<tag>, typescript-<tag>
#                      all resolve here, and the agent loads only that language's section
#   requires_capability  optional capability that must be true in .feanor/profile.toml
#
# Validated by scripts/validate-okf.py: every path must exist, and every convention
# file must be reachable by a tag or documented as path-matched only.

[meta]
version = "1.0.0"

# ── Priority 1: security. Never dropped to make room. ────────────────────────

[tags.security]
files = ["conventions/cross-stack/security.md"]
aliases = ["appsec"]
priority = 1
language_qualified = true

[tags.access-control]
files = ["conventions/cross-stack/access-control.md"]
aliases = ["authorization", "idor", "ownership", "multi-tenancy", "mass-assignment"]
