server:
  http_listen_port: 9081  # non-default: avoids collision with dotfiles Promtail on 9080
  grpc_listen_port: 0    # gRPC disabled — not needed for HTTP push-to-Loki mode

positions:
  filename: /var/lib/promtail/positions-nizam-os.yaml

clients:
  - url: http://localhost:3100/loki/api/v1/push

scrape_configs:
  - job_name: nizam-os
    static_configs:
      - targets:
          - localhost
        labels:
          job: nizam-os
          host: vps
          __path__: /home/vazir/nizam-os/logs/*.log

    pipeline_stages:
      - json:
          expressions:
            level: level
            script: script
      - template:
          source: level
          template: '{{ ToLower .Value }}'
      - labels:
          level:
          script:
