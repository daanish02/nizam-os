[project]
name = "knowledge-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "nizam-shared",
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
    "beautifulsoup4>=4.12",
    "youtube-transcript-api>=0.6",
    "yt-dlp>=2024.1",
]

[tool.uv.sources]
nizam-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
