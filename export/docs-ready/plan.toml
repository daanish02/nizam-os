# nizam-os cycle 1 — the full ticket plan, Phases 1 to 7.
#
# Lives at docs/plan.toml in the new repo. Driven by Feanor's plan.py:
#   uv run --with tomlkit --with rich python export/feanor-conventions/scripts/plan.py check|status|next|verify|done
#
# TDD is mandatory. For every code ticket:
#   1. Write the named tests in acceptance_criteria first, and watch them fail.
#   2. Then write the code.
#   3. `plan.py verify` runs verification_command; only then `plan.py done`.
# Acceptance-criteria prefixes:
#   [slow]      integration test against a real, throwaway Postgres database
#               (the `pg` fixture); runs under `check.sh --all`.
#   [property]  hypothesis property-based test.
#   (none)      fast unit test.
# Conventions, fixtures and the coverage gate: docs/TESTING.md.
# Ticket ids are TICK-<phase><nn>. Branch-name checks in check-git.py don't
# apply: the owner commits manually after each phase.

# ============================ PHASE 1 — tooling, secrets, host deps ============================

[[tickets]]
id = "TICK-101"
phase = 1
title = "Python project skeleton, check.sh, coverage gate"
status = "todo"
description = "Root pyproject.toml for a single `nizam` package, uv, requires-python >=3.12,<3.13. Dev deps: ruff, pytest, pytest-asyncio, pytest-cov, hypothesis, respx (httpx mocking), prometheus-client (metrics format parser in tests). Ruff line-length 100. pytest markers: slow, property. nizam/__init__.py (version). scripts/check.sh: fast mode runs ruff check, ruff format --check, and pytest -m 'not slow'. `--all` mode runs ruff, then pytest over everything including slow, then coverage via scripts/coverage_gate.py. The gate reads coverage.json and enforces >=90% line coverage on each of nizam/core, nizam/calc and nizam/finance, and >=80% on nizam overall. A package with no source files yet is skipped, not failed."
acceptance_criteria = [
  "tests/scripts/test_coverage_gate.py::test_passes_when_all_thresholds_met — synthetic coverage.json: core 95, calc 92, finance 91, overall 85 → exit 0",
  "::test_fails_naming_package_below_90 — core at 89.9 → non-zero exit, and the message names nizam/core and 89.9",
  "::test_fails_when_overall_below_80",
  "::test_skips_package_with_no_source_files — nizam/finance absent → not counted, no failure",
  "::test_rejects_missing_coverage_json_with_clear_error",
  "`bash scripts/check.sh` exits 0 on the skeleton",
]
target_files = ["pyproject.toml", "nizam/__init__.py", "scripts/check.sh", "scripts/coverage_gate.py", "tests/conftest.py", "tests/scripts/test_coverage_gate.py"]
convention_tags = ["coding-principles", "tdd", "boundaries", "python", "testing"]
spec_ref = "docs/TESTING.md"
verification_command = "bash scripts/check.sh"
working_dir = "."
depends_on = []
tests_passing = false

