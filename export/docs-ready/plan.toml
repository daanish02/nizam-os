# ============================ PHASE 3 — deploy + LiteLLM ============================

[[tickets]]
id = "TICK-301"
phase = 3
title = "scripts/deploy.sh — release dir, flip, manifest, rollback"
status = "todo"
description = "Per docs/ARCHITECTURE.md 'Deploy model'.\nSteps: git archive of a COMMITTED ref (refuses a dirty ref) → ~/.local/share/nizam/releases/<sha> → uv sync --frozen --no-dev → atomic flip of `current` (ln -sfn to current.tmp, then mv -Tf) → apply deploy/manifest.txt → daemon-reload → restart only units whose file content changed.\nManifest kinds: unit-system, link, copy-root (visudo -cf before installing any sudoers file).\nState: ~/.local/state/nizam/deploy-links.txt; links no longer in the manifest are removed. Keeps the last 5 releases.\nFlags: --dry-run, --rollback, --sync-secrets (runs secrets.sh install).\nTesting: NIZAM_HOME_ROOT and NIZAM_DEPLOY_NO_SUDO=1 redirect every path and skip sudo/systemctl, so tests run in tmp."
acceptance_criteria = [
  "tests/scripts/test_deploy_sh.py::test_refuses_uncommitted_ref",
  "::test_builds_release_named_by_sha_and_flips_current",
  "::test_flip_is_atomic_current_never_missing — current is a valid symlink at every observed moment during the flip",
  "::test_manifest_link_created_and_recorded",
  "::test_stale_link_removed_when_dropped_from_manifest",
  "::test_rollback_points_current_to_previous_release",
  "::test_keeps_only_last_five_releases",
  "::test_dry_run_changes_nothing — tmp tree byte-identical before and after",
  "::test_changed_unit_detection_lists_only_modified_units",
  "::test_rejects_unknown_manifest_kind",
]
target_files = ["scripts/deploy.sh", "tests/scripts/test_deploy_sh.py"]
convention_tags = ["coding-principles", "tdd", "boundaries", "git"]
spec_ref = "docs/ARCHITECTURE.md"
verification_command = "bash scripts/check.sh"
working_dir = "."
depends_on = [{ id = "TICK-103", reason = "--sync-secrets calls secrets.sh install" }]
tests_passing = false

